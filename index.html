      if(!TP[w]){alert("无此仓库代码包车价格");return}
      var sz=document.getElementById("trk").value;
      var fp=(TP[w]||{})[sz]||0;
      d20=Math.round(fp/r);d40=d20;
    }else if(tp==="mix"){
      // 混载1~3区可用
      if(z>3){alert("混载模式仅支持1~3区仓库");return}
      d20=Math.round(3500*1.1*tCBM);d40=d20;
    }else{
      // pc 或 green：所有区都用价格表（含超尺寸附加）
      var dJ=0,needTruck=false;
      for(var i=0;i<rows.length;i++){
        var ri=rows[i];
        var trvR=trv(ri.sum3,ri.kg,tp,z,w,ri.L,ri.W,ri.H);
        if(trvR.needTruck){needTruck=true;}
        dJ+=ri.q*trvR.price;
      }
      // 如果有货物超尺寸，自动转包车
      if(needTruck && z===7){
        // 根据总体积和总重量自动选择车型
        var trkSize;
        if(tCBM<=8 && tKg<=1500) trkSize="2T";
        else if(tCBM<=18 && tKg<=2500) trkSize="4T";
        else trkSize="10T";
        
        // 查找非FBA仓库的包车价格
        var truckP={
          "JCL天户町":{"2T":29000,"4T":35000,"10T":46000},
          "乐天流山":{"2T":32000,"4T":38000,"10T":48000},
          "JCL箕面":{"2T":0,"4T":95000,"10T":135000},
          "谷仓上尾":{"2T":32000,"4T":40000,"10T":50000},
          "JCL六方町":{"2T":29000,"4T":35000,"10T":46000}
        };
        var fp=(truckP[w]||{})[trkSize]||0;
        if(fp>0){
          dJ=fp;  // 包车价格已经是JPY，无需转换
          // 更新车型选择框
          var trkSel=document.getElementById("trk");
          trkSel.value=trkSize;
          alert("三边和超过260cm，已自动切换为"+trkSize+"包车\n包车费用："+fp+" JPY");
        }else{
          alert("货物三边和超过260cm，请手动选择包车模式");
        }
      }
      d20=Math.round(dJ);d40=d20;
    }
    document.getElementById("ab20").textContent=fm(ab20);
    document.getElementById("d20").textContent=fm(d20);
    document.getElementById("t20").textContent=fm(ab20+d20);
    document.getElementById("up20").textContent=tCBM>0?Math.round((ab20+d20)*r/tCBM).toLocaleString()+" CNY/m³":"-";
    document.getElementById("ab40").textContent=fm(ab40);
    document.getElementById("d40").textContent=fm(d40);
    document.getElementById("t40").textContent=fm(ab40+d40);
    document.getElementById("up40").textContent=tCBM>0?Math.round((ab40+d40)*r/tCBM).toLocaleString()+" CNY/m³":"-";
    document.getElementById("tl").textContent={pc:"拼车",green:"绿盒",mix:"混载",truck:"包车"}[tp]+" "+w+"【"+z+"区】";
    document.getElementById("s2").textContent=tQty;
    document.getElementById("s3").textContent=tCBM.toFixed(3);
    document.getElementById("s4").textContent=Math.round(tKg);
    var bd=document.getElementById("bd");bd.innerHTML="";
    if(md!=="total"){
      for(var i=0;i<rows.length;i++){var ri=rows[i];var cbm=ri.L*ri.W*ri.H/1e6*ri.q;var trvR=trv(ri.sum3,ri.kg,tp,z,w,ri.L,ri.W,ri.H);var tr=document.createElement("tr");tr.innerHTML="<td>"+(i+1)+"</td><td class=n>"+ri.q+"</td><td class=n>"+ri.kg.toFixed(1)+"</td><td class=n>"+ri.L+"</td><td class=n>"+ri.W+"</td><td class=n>"+ri.H+"</td><td class=n>"+(ri.kg*ri.q).toFixed(1)+"</td><td class=n>"+ri.sum3+"</td><td class=n>"+cbm.toFixed(4)+"</td><td>"+trvR.tier+"</td><td class=n>"+trvR.price+"</td>";bd.appendChild(tr);}
      document.getElementById("det").className="det sh";
    }else{
      document.getElementById("det").className="det";
    }
    document.getElementById("rs").className="c rs sh";
    document.getElementById("rs").scrollIntoView({behavior:"smooth",block:"start"});
  });
  document.getElementById("clrBtn").addEventListener("click",function(){
    var defTrk='<option value="2T">2T = 1500KG / 8CBM</option><option value="4T" selected>4T = 2500KG / 18CBM</option><option value="10T">10T = 10000KG / 30CBM</option>';
    document.getElementById("wh").selectedIndex=0;document.getElementById("rt").value="";document.getElementById("sQ").value="1";document.getElementById("sK").value="";document.getElementById("sL").value="";document.getElementById("sW").value="";document.getElementById("sH").value="";document.getElementById("sT").value="";document.getElementById("txt").value="";document.getElementById("tQ").value="1";document.getElementById("tT").value="";document.getElementById("tC").value="";document.getElementById("trk").innerHTML=defTrk;document.getElementById("trk").disabled=false;document.getElementById("rs").className="c rs";document.getElementById("det").className="det";sw("multi");st("pc");upd();
  });
})();
</script>
